# ========================================
# 测试设备列表配置
# ========================================
# 可以配置多台测试设备，测试时通过 --device 参数选择

devices:
  # 默认测试设备
  default:
    name: "测试门锁_001"
    device_id: "lock_001"
    # 门锁型号
    model: "SL-100"
    # 串口配置（覆盖 config.yaml 中的默认配置）
    serial:
      port: "COM3"
      baudrate: 115200

  # 第二台设备（示例）
  lock_002:
    name: "测试门锁_002"
    device_id: "lock_002"
    model: "SL-200"
    serial:
      port: "COM4"
      baudrate: 115200

  # 米家专用测试设备
  mijia_lock:
    name: "米家测试门锁"
    device_id: "mijia_001"
    model: "SL-100"
    serial:
      port: "COM5"
      baudrate: 115200
